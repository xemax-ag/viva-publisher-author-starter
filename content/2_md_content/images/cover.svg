      <circle r="150"/>
      <g>
        <rect x="-32" y="-205" width="64" height="80" rx="8"/>
        <rect x="-32" y="125" width="64" height="80" rx="8"/>
        <rect x="-205" y="-32" width="80" height="64" rx="8"/>
        <rect x="125" y="-32" width="80" height="64" rx="8"/>
      </g>
      <g transform="rotate(45)">
        <rect x="-32" y="-205" width="64" height="80" rx="8"/>
        <rect x="-32" y="125" width="64" height="80" rx="8"/>
        <rect x="-205" y="-32" width="80" height="64" rx="8"/>
        <rect x="125" y="-32" width="80" height="64" rx="8"/>
      </g>
    </g>
    <circle r="62" fill="#E8F4F7"/>
    <circle r="150" fill="none" stroke="#03A4C0" stroke-width="10" stroke-dasharray="30 22" transform="scale(1.55)"/>
  </g>
  <g fill="#C3D1D5">
    <rect x="640" y="1780" width="820" height="20"/><rect x="640" y="1828" width="700" height="20"/>
  </g>
  <!-- a display formula: fraction bar and blocks -->
  <g fill="#1F3A44">
    <rect x="860" y="1915" width="70" height="44" rx="6"/>
    <rect x="955" y="1930" width="40" height="12"/><rect x="955" y="1950" width="40" height="12"/>
    <rect x="1030" y="1888" width="120" height="40" rx="6"/>
    <rect x="1020" y="1936" width="140" height="8"/>
    <rect x="1050" y="1952" width="80" height="40" rx="6"/>
