<svg xmlns="http://www.w3.org/2000/svg" width="2100" height="2700" viewBox="0 0 2100 2700">
  <!-- Cover: printed pages on a layout grid (technical publishing), no text: fills page 1 below the colour band -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F8F9"/>
      <stop offset="1" stop-color="#DCE8EB"/>
    </linearGradient>
  </defs>
  <rect width="2100" height="2700" fill="url(#bg)"/>
  <path d="M100 0V2700M200 0V2700M300 0V2700M400 0V2700M500 0V2700M600 0V2700M700 0V2700M800 0V2700M900 0V2700M1000 0V2700M1100 0V2700M1200 0V2700M1300 0V2700M1400 0V2700M1500 0V2700M1600 0V2700M1700 0V2700M1800 0V2700M1900 0V2700M2000 0V2700M0 100H2100M0 200H2100M0 300H2100M0 400H2100M0 500H2100M0 600H2100M0 700H2100M0 800H2100M0 900H2100M0 1000H2100M0 1100H2100M0 1200H2100M0 1300H2100M0 1400H2100M0 1500H2100M0 1600H2100M0 1700H2100M0 1800H2100M0 1900H2100M0 2000H2100M0 2100H2100M0 2200H2100M0 2300H2100M0 2400H2100M0 2500H2100M0 2600H2100" fill="none" stroke="#C9D8DC" stroke-width="2"/>
  <!-- column guides -->
  <g stroke="#03A4C0" stroke-width="3" stroke-dasharray="18 14" opacity="0.35">
    <line x1="300" y1="0" x2="300" y2="2700"/>
    <line x1="1800" y1="0" x2="1800" y2="2700"/>
    <line x1="0" y1="2350" x2="2100" y2="2350"/>
  </g>

  <!-- back page, turned left -->
  <g transform="rotate(-9 1050 1500)">
    <rect x="530" y="760" width="980" height="1380" fill="#1F3A44" opacity="0.10" transform="translate(22 26)"/>
    <rect x="530" y="760" width="980" height="1380" fill="#FFFFFF" stroke="#B9C9CE" stroke-width="3"/>
    <g fill="#D3DEE1">
      <rect x="610" y="860" width="600" height="34"/>
      <rect x="610" y="940" width="820" height="18"/><rect x="610" y="985" width="820" height="18"/>
      <rect x="610" y="1030" width="760" height="18"/><rect x="610" y="1075" width="820" height="18"/>
      <rect x="610" y="1120" width="540" height="18"/>
    </g>
  </g>

  <!-- middle page, turned right: a table and a chart -->
  <g transform="rotate(6 1050 1500)">
    <rect x="560" y="780" width="980" height="1380" fill="#1F3A44" opacity="0.12" transform="translate(22 26)"/>
    <rect x="560" y="780" width="980" height="1380" fill="#FFFFFF" stroke="#B9C9CE" stroke-width="3"/>
    <rect x="640" y="870" width="820" height="60" fill="#03A4C0" opacity="0.85"/>
    <g fill="none" stroke="#B9C9CE" stroke-width="3">
      <rect x="640" y="930" width="820" height="300"/>
      <line x1="640" y1="1005" x2="1460" y2="1005"/><line x1="640" y1="1080" x2="1460" y2="1080"/>
      <line x1="640" y1="1155" x2="1460" y2="1155"/>
      <line x1="913" y1="870" x2="913" y2="1230"/><line x1="1187" y1="870" x2="1187" y2="1230"/>
    </g>
    <g fill="#03A4C0">
      <rect x="700" y="1700" width="90" height="250" opacity="0.45"/>
      <rect x="840" y="1580" width="90" height="370" opacity="0.6"/>
      <rect x="980" y="1640" width="90" height="310" opacity="0.75"/>
      <rect x="1120" y="1460" width="90" height="490"/>
      <rect x="1260" y="1520" width="90" height="430" opacity="0.85"/>
    </g>
    <line x1="660" y1="1950" x2="1420" y2="1950" stroke="#1F3A44" stroke-width="5"/>
  </g>

  <!-- front page: heading, text, picture, formula line -->
