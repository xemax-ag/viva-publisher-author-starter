  </g>
  <!-- crop marks of the front page -->
  <g stroke="#1F3A44" stroke-width="4">
    <path d="M500 816H540M560 756V796" fill="none"/>
    <path d="M1600 816H1560M1540 756V796" fill="none"/>
    <path d="M500 2196H540M560 2256V2216" fill="none"/>
    <path d="M1600 2196H1560M1540 2256V2216" fill="none"/>
  </g>

  <!-- ruler at the bottom -->
  <rect x="0" y="2480" width="2100" height="220" fill="#1F3A44"/>
  <g stroke="#FFFFFF" stroke-width="4" opacity="0.8">
    <path d="M50 2480v70M150 2480v40M250 2480v40M350 2480v40M450 2480v40M550 2480v70M650 2480v40M750 2480v40M850 2480v40M950 2480v40M1050 2480v70M1150 2480v40M1250 2480v40M1350 2480v40M1450 2480v40M1550 2480v70M1650 2480v40M1750 2480v40M1850 2480v40M1950 2480v40M2050 2480v70"/>
  </g>
  <rect x="0" y="2650" width="2100" height="50" fill="#03A4C0"/>
</svg>
