  <rect x="560" y="816" width="980" height="1380" fill="#FFFFFF" stroke="#9FB3B9" stroke-width="3"/>
  <rect x="560" y="816" width="980" height="120" fill="#03A4C0"/>
  <rect x="640" y="858" width="360" height="36" fill="#FFFFFF" opacity="0.9"/>
  <g fill="#C3D1D5">
    <rect x="640" y="1000" width="820" height="20"/><rect x="640" y="1048" width="820" height="20"/>
    <rect x="640" y="1096" width="780" height="20"/><rect x="640" y="1144" width="820" height="20"/>
    <rect x="640" y="1192" width="460" height="20"/>
