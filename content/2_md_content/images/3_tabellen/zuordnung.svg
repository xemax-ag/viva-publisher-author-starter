<svg xmlns="http://www.w3.org/2000/svg" width="16cm" height="2.78cm" viewBox="0 0 16 2.78">
  <!-- Lösungslinien einer Zuordnungsaufgabe über einer Tabelle von 16 cm (Spalten 4.5 cm, 3 cm, 8.5 cm) mit vier
